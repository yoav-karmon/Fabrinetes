[hdlforge.setup]
description = "Setting up hdlforge as a global command (if not already in PATH)"
required_variables = [
    "hdlforge=<command_available_in_path>",
    "REPO_TOP=<fpga_repository_root>"
]
option_1 = "Add to PATH: export PATH=$PATH:<hdlforge_directory>"
option_2 = "Create symlink: ln -s <hdlforge_script> /usr/local/bin/hdlforge"
option_3 = "Add alias: alias hdlforge='<hdlforge_script>'"
option_4 = "Copy to system: cp <hdlforge_script> /usr/local/bin/hdlforge"
note = "If hdlforge is already in PATH, you can call it directly as 'hdlforge'"

[hdlforge.setup_examples]
example_1 = "# If hdlforge is already in PATH, just call it directly:"
example_2 = "hdlforge --help"
example_3 = "hdlforge --list"
example_4 = ""
example_5 = "# If NOT in PATH, add to PATH:"
example_6 = "export PATH=$PATH:<hdlforge_directory>"
example_7 = "# Or create symlink:"
example_8 = "sudo ln -s <hdlforge_script> /usr/local/bin/hdlforge"

[hdlforge.Verilator]
description = "Simulation and verification builds using Verilator"
command = "hdlforge Verilator"
required_params = ["--project", "--step", "--SimTargetName"]
subcommands = ["build", "sim"]

[hdlforge.Verilator.build]
description = "Compile SystemVerilog to C++ executable"
command = "hdlforge Verilator --project <project_file.hdlforge.toml> --step build --SimTargetName <target>"
required_params = ["--project", "--SimTargetName"]
optional_params = ["--clean", "--extra-env", "--flags"]

[hdlforge.Verilator.sim]
description = "Run simulation (requires successful build first)"
command = "hdlforge Verilator --project <project_file.hdlforge.toml> --step sim --SimTargetName <target>"
required_params = ["--project", "--SimTargetName"]
prerequisite = "Successful build step must be completed first"
sim_output_location = "Simulation output will be located at <verilator_settings.build_dir>/<sim target name>"
vcd_to_csv_conversion = "Automatically converts dump.vcd to dump.csv after simulation completion"
vcd_csv_output = "VCD file: build_dir/SimTargetName/dump.vcd, CSV file: build_dir/SimTargetName/dump.csv"

[hdlforge.projects]
description = "Project management tasks"
command = "hdlforge projects"
subcommands = ["list", "help"]

[hdlforge.projects.list]
description = "List available projects"
command = "hdlforge projects"

[hdlforge.projects.help]
description = "Show HDLForge help information"
command = "hdlforge help"

[hdlforge.vivado]
description = "Synthesis and implementation builds using Vivado"
command = "hdlforge vivado"
required_params = ["--project", "--step"]
subcommands = ["new", "syn", "impl", "bit"]

[hdlforge.vivado.new]
description = "Create new Vivado project"
command = "hdlforge vivado --project <project_file.hdlforge.toml> --step new --clean"
required_params = ["--project", "--step new"]
optional_params = ["--clean"]

[hdlforge.vivado.syn]
description = "Run synthesis"
command = "hdlforge vivado --project <project_file.hdlforge.toml> --step syn --run-flow <flow>"
required_params = ["--project", "--step syn", "--run-flow"]

[hdlforge.vivado.impl]
description = "Run implementation"
command = "hdlforge vivado --project <project_file.hdlforge.toml> --step impl --run-flow <flow>"
required_params = ["--project", "--step impl", "--run-flow"]

[hdlforge.vivado.bit]
description = "Generate bitstream"
command = "hdlforge vivado --project <project_file.hdlforge.toml> --step bit --run-flow <flow>"
required_params = ["--project", "--step bit", "--run-flow"]

[hdlforge.help]
description = "Show comprehensive HDLForge help"
command = "hdlforge help"




[error_handling_protocol]
step_1 = "Analyze the first error encountered"
step_2 = "Offer specific solution(s) for the first error"
step_3 = "Ask for permission before proceeding with fixes"
step_4 = "Do NOT automatically fix errors without user approval"

[error_handling_protocol.missing_project_parameter]
error_message = "'<tool>' did not receive required positional arguments: 'project'"
cause = "Missing --project <project_file.hdlforge.toml> parameter in command"
solution_1 = "Add --project <project_file.hdlforge.toml> to your command"
solution_2 = "Example: hdlforge Verilator --project <project_name>.hdlforge.toml --step build --SimTargetName main"
solution_3 = "List available projects: hdlforge projects"
solution_4 = "Check current directory for .hdlforge.toml files to identify project names"

[best_practices]
practice_1 = "Always run commands from the project directory"
practice_2 = "Always specify project explicitly: Use --project <project_file.hdlforge.toml> parameter (required)"
practice_3 = "Use specific simulation targets: Always specify --SimTargetName parameter"
practice_4 = "Verify builds: Check for 0 errors and 0 warnings"
practice_5 = "Manage dependencies: Ensure proper file order in TOML configuration"
practice_6 = "Clean builds: Use --clean flag when encountering build issues"
practice_7 = "Global access: hdlforge is available in PATH and can be called from anywhere"
