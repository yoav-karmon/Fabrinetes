# HDLForge Documentation Configuration
# This file documents HDLForge settings, commands, and best practices

[documentation]
title = "HDLForge Documentation"
version = "1.0"
description = "Python-based build system that wraps Verilator and Vivado tools"
format = "TOML configuration documentation"

[hdlforge.file_locations]
description = "HDLForge file locations and installation paths"
installed_files_location = "Installed HDLForge files are located in: /opt/project_setup/"
repository_files_location = "Repository files for editing are located in: /home/ykarmon/repo/Fabrinetes/source/project_setup/"
editing_note = "DO NOT edit the installed files directly - edit the repository files and reinstall"
installation_process = "Changes to repository files require reinstallation to update the installed files"
script_location = "Main HDLForge script: tasks.py (in repository) -> installed to system PATH"
config_location = "HDLForge_Documentation.toml: repository documentation file (not installed)"

[hdlforge.development_workflow]
description = "Development workflow for modifying HDLForge"
step_1 = "Edit files in repository: /path/to/repo/Fabrinetes/source/project_setup/"
step_2 = "Test changes locally in repository directory"
step_3 = "Commit changes to Git repository"
step_4 = "Reinstall HDLForge to update system-installed files"
step_5 = "Verify changes work in installed version"
warning = "Never edit files in /opt/project_setup/ or /usr/local/bin/ directly"

[tldr]
working_directory= "<project_directory_path>"
project_file = "working_directory/<project_name>.hdlforge.toml"
verilator = "cd <working_directory> && hdlforge Verilator --project <project_file.hdlforge.toml> --step <build/sim> --SimTargetName <target_name> [--clean] [--extra-env DEBUG=1] [--flags <flags>]"
vivado = "cd <working_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step <new/syn/impl/bit/list_runs/reset_run> [--run-flow <flow_name>] [--clean]"
projects = "cd <working_directory> && hdlforge projects"
help = "hdlforge help"

[hdlforge]
description = "Main HDLForge command - Python-based build system wrapper"
command = "hdlforge"
subcommands = ["Verilator", "projects", "vivado", "help"]
command_pattern = "hdlforge <main_tool> --project <project_file.hdlforge.toml> <--command_flags_of_tool>"
command_explanation = "HDLForge follows a consistent pattern: hdlforge <main_tool> --project <project_file.hdlforge.toml> <--command_flags_of_tool>"
command_structure = "Main tool (Verilator/vivado/projects) followed by required --project parameter and tool-specific command flags"
execution_location = "All commands must be run from the project directory containing the .hdlforge.toml file"
project_requirement = "All HDLForge commands now require explicit --project <project_file.hdlforge.toml> parameter (no automatic selection)"

[project]
description = "HDLForge project structure and organization"
project_directory = "Top-level folder containing the project configuration file"
project_toml_file = "<project_name>.hdlforge.toml - Project configuration file located in the project directory"
project_structure = "The project directory is the top folder where the .hdlforge.toml file is located"
execution_context = "All HDLForge commands must be run from this project directory"
project_examples = "Generic project naming patterns: <domain>_<function> (e.g., network_router, memory_controller, comm_uart)"
project_parameter_requirement = "All HDLForge commands now require explicit --project <project_file.hdlforge.toml> parameter"
project_parameter_purpose = "Forces explicit project selection, eliminates automatic selection ambiguity"
project_parameter_examples = "--project <project_name>.hdlforge.toml, --project <another_project>.hdlforge.toml, --project <custom_project>.hdlforge.toml"

[project.settings]
description = "Defines basic project metadata and directory structure for HDLForge"
purpose = "Establishes project identity, location, and organizational structure"
example_file = "Generic project configuration template showing basic structure"
project_name = "Unique project identifier that distinguishes this project from others"
project_path = "Project directory path using REPO_TOP environment variable (e.g., $REPO_TOP/projects/<project_name>)"
build_directories = "Tool-specific build directories: _verilator (Verilator), _vivado (Vivado)"
source_organization = "Sources organized in logical subdirectories by functionality and design hierarchy"

[project.sim_targets]
main = "Default simulation target configuration with standard test parameters"
test_variants = "Alternative test configurations with different parameters or test cases"
custom_targets = "User-defined simulation targets with specific configurations for different scenarios"

[project.source_files]
verilator_sources = "SystemVerilog files organized by design hierarchy for Verilator simulation"
vivado_sources = "SystemVerilog and VHDL files for Vivado synthesis including platform-specific components"
constraint_files = "XDC constraint files assigned to specific Vivado filesets for timing and pin constraints"
python_tests = "Python test files for cocotb-based verification and testbench automation"

[project.verilator_settings]
description = "Configures Verilator simulation environment and build parameters"
purpose = "Defines how SystemVerilog code is compiled and simulated using Verilator"
example_file = "Generic Verilator configuration template showing simulation setup"
build_dir = "Build output directory where Verilator generates C++ simulation code (default: _verilator)"
includes_paths = "Include directories for Verilator compilation containing shared headers and interfaces"
sim_targets = "Simulation target configurations defining different test scenarios and parameters"


[project.vivado_settings]
description = "Configures Vivado synthesis and implementation environment"
purpose = "Defines how HDL code is synthesized and implemented for FPGA targets"
example_file = "Generic Vivado configuration template showing synthesis and implementation setup"
build_dir = "Vivado build directory where project files and build artifacts are stored (default: _vivado)"
project_name = "Vivado project name (can differ from HDLForge project name)"
top_module = "Top-level module name for synthesis and implementation"
part = "Target FPGA part number specifying device family, package, and speed grade"
runs_flow = "Build flow configurations for synthesis and implementation"


[project.sources]
description = "Defines source files and their organization for different build tools"
purpose = "Specifies which files are used by which tools and how they are organized"
example_file = "Generic source file configuration template showing file organization"
file_entries = "Multiple [[sources.files]] entries organizing source files by tool usage and functionality"
tool_flags = "Tool inclusion flags (verilator/vivado) determining which build tools process each file group"
relative_paths = "Path resolution method: relative_to_project_path=true makes paths relative to project directory"
fileset_assignment = "Vivado fileset assignment for organizing files into logical groups for synthesis"

[[hdlforge.command_permutations]]
description = "Compile SystemVerilog to C++ executable (run from project directory)"
command = "cd <project_directory> && hdlforge Verilator --project <project_file.hdlforge.toml> --step build --SimTargetName <target_name> [--clean] [--extra-env DEBUG=1] [--flags <flags>]"

[[hdlforge.command_permutations]]
description = "Run simulation (requires successful build first, run from project directory)"
command = "cd <project_directory> && hdlforge Verilator --project <project_file.hdlforge.toml> --step sim --SimTargetName <target_name>"

[[hdlforge.command_permutations]]
description = "List available projects"
command = "hdlforge projects"

[[hdlforge.command_permutations]]
description = "Show HDLForge help information"
command = "hdlforge help"

[[hdlforge.command_permutations]]
description = "Create new Vivado project (run from project directory)"
command = "cd <project_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step new --clean"

[[hdlforge.command_permutations]]
description = "Run Vivado synthesis (run from project directory)"
command = "cd <project_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step syn --run-flow <flow_name>"

[[hdlforge.command_permutations]]
description = "Run Vivado implementation (run from project directory)"
command = "cd <project_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step impl --run-flow <flow_name>"

[[hdlforge.command_permutations]]
description = "Generate Vivado bitstream (run from project directory)"
command = "cd <project_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step bit --run-flow <flow_name>"

[[hdlforge.command_permutations]]
description = "List Vivado runs (run from project directory)"
command = "cd <project_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step list_runs"

[[hdlforge.command_permutations]]
description = "Reset Vivado run (run from project directory)"
command = "cd <project_directory> && hdlforge vivado --project <project_file.hdlforge.toml> --step reset_run"

[[hdlforge.command_permutations]]
description = "Show Verilator help"
command = "hdlforge Verilator --help"

[[hdlforge.command_permutations]]
description = "Show Vivado help"
command = "hdlforge vivado --help"

[[hdlforge.command_permutations]]
description = "Show projects help"
command = "hdlforge projects --help"


[hdlforge.config_file]
description = "Project configuration file that defines all HDLForge settings"
filename = "<project_file.hdlforge.toml>"
location = "Located in the project directory (top folder)"
purpose = "Defines project settings, source files, tool configurations, and build parameters"
working_directory = "Directory where we run the command from (same as project directory)"
config_file = "Project configuration file"

[hdlforge.config_file.settings]
project_name = "Project file identifier"
project_path = "Project directory path"

[hdlforge.config_file.verilator_settings]
