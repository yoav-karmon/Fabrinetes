version: '3.8'

services:
  # Base image builder
  base-builder:
    build:
      context: ./base
      dockerfile: Dockerfile
    image: fabrinetes-base:latest
    command: /bin/true

  # Testing container (lightweight)
  fabrinetes-dev-testing:
    build:
      context: .
      dockerfile: Dockerfile.testing
    image: fabrinetes-dev-testing:latest
    depends_on:
      - base-builder
    volumes:
      - ${HOME}:${HOME}
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host

  # Development container (full features)
  fabrinetes-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: fabrinetes-dev:latest
    depends_on:
      - base-builder
    volumes:
      - ${HOME}:${HOME}
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host

  # FPGA container (with FPGA tools)
  fabrinetes-fpga-full:
    build:
      context: .
      dockerfile: Dockerfile.fpga
    image: fabrinetes-fpga-full:latest
    depends_on:
      - base-builder
    volumes:
      - ${HOME}:${HOME}
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
